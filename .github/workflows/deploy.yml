name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main # Jalankan otomatis setiap push/merge ke branch main
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Bun runtime
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 2. Install dependencies
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 3. Type check & Test (Opsional, memastikan tidak ada error sebelum deploy)
      - name: Type check & Test
        run: |
          bun run typecheck
          bun run test

      # 4. Terapkan Migrasi D1 ke Remote Database (Jika ada perubahan skema DB)
      - name: Apply D1 Migrations
        run: bun run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 5. Build dan Deploy ke Cloudflare
      - name: Deploy to Cloudflare Workers
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
