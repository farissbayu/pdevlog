<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pdevlog-icon.png" />
    <link rel="apple-touch-icon" href="/pdevlog-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A private dev log for brag-worthy wins and the lessons behind them. Capture in STAR format, organize by workspace, and keep notes in Markdown."
    />
    <title>Personal Dev Log</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("pdevlog-theme") || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
